# Peta Fitur & Keyword Bisnis — Diego Music Store ERP
# Digunakan oleh CodeGraphContext (`resolve_feature_context` / `cgc feature resolve`)
# dan filter Feature di Visualizer Web (`http://localhost:8765`).
#
# Catatan: Seluruh path `entry_points` relatif terhadap `public/diego-music-store`.

version: 1
features:
  - id: sku-management
    name: "SKU & Penomoran Produk per Cabang"
    description: "Generate SKU unik sekuensial per prefix cabang (`sku_sequences`), pulihkan SKU master, dan regenerasi SKU saat buat/ubah cabang."
    keywords:
      - sku
      - generate sku
      - pulihkan sku
      - sku master
      - regenerasi sku
      - penomoran produk
      - prefix cabang
      - prefix sku
      - sku_prefix
      - sku_sequences
      - brg
      - reserve sku
      - format sku
    entry_points:
      - app/Actions/Branch/RegenerateBranchProductSkus.php
      - app/Actions/Branch/SyncBranchProductSkusFromMaster.php
      - app/Actions/Product/ReserveNextSku.php
      - app/Actions/Product/SyncSkuSequenceFromExisting.php
      - app/Helpers/ProductHelper.php
      - app/Models/SkuSequence.php
    hints:
      - "Penomoran SKU per prefix + cabang dikelola di tabel `sku_sequences` via `SkuSequence` dan `ProductHelper::generateUniqueSku`."
      - "Format `BRG2122` menjadi `<PREFIX>-2122` (tanpa literal BRG), sedangkan huruf non-BRG seperti `D0642` dipertahankan."

